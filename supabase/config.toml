#:schema https://supabase.com/schemas/config/v1.json
# Local isolated development only; this does not link or configure a remote project.
project_id = "darkshield"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Aligned with the shared development project (PostgreSQL 17).
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
# HU-11 will configure and test the complete authentication flow.
enable_signup = false
enable_anonymous_sign_ins = false

[local_smtp]
enabled = true
port = 54324

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
